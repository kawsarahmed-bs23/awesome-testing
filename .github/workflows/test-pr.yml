name: PR Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: test (${{ matrix.project }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, Mobile Chrome]
    env:
      ENV: staging
      # Optional overrides: set these as repository variables/secrets to target your real staging app.
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
      API_URL: ${{ vars.STAGING_API_URL }}
      ADMIN_USERNAME: ${{ secrets.STAGING_ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Create env file from template
        run: cp config/.env.example config/.env.staging
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run tests (headless)
        run: npx playwright test --project="${{ matrix.project }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
